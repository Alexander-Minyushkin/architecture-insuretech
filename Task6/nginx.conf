http {
    # Define a shared memory zone for rate limiting
    # Key: $binary_remote_addr (client IP address)
    # Rate: 10 requests per minute (10r/m)
    limit_req_zone $binary_remote_addr zone=my_rate_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Apply rate limiting
            limit_req zone=my_rate_limit burst=5 nodelay;

            # Proxy requests to the backend servers
            proxy_pass http://backend_servers;

            # Return HTTP 429 (Too Many Requests) if the rate limit is exceeded
            error_page 503 =429 /rate_limit_exceeded;
        }

        # Custom error response for rate limit exceeded
        location = /rate_limit_exceeded {
            return 429 "Too Many Requests. Please try again later.\n";
        }
    }
}